<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOSQUE ENCANTADO</title>
<meta name="description" content="El Capitalista de cartas en un bosque encantado: quédate sin cartas el primero. Con amigos por internet o contra la máquina.">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="idiomas" role="group" aria-label="Idioma / Language">
  <button type="button" data-idioma="es">ES</button>
  <button type="button" data-idioma="en">EN</button>
</div>

<!-- Inicio: crear o unirse a una partida -->
<section id="inicio" class="pantalla">
  <header class="portada">
    <h1>BOSQUE<span>ENCANTADO</span></h1>
    <p class="lema" data-t="lema"></p>
  </header>
  <div class="panel formulario">
    <label><span data-t="tuNombre"></span>
      <input id="nombre" maxlength="18" autocomplete="nickname">
    </label>
    <button id="crear" class="boton principal" type="button" data-t="crear"></button>
    <div class="separador"><span data-t="o"></span></div>
    <label><span data-t="codigo"></span>
      <input id="codigo" maxlength="5" autocapitalize="characters" autocomplete="off" spellcheck="false">
    </label>
    <button id="unirse" class="boton" type="button" data-t="unirse"></button>
    <p id="error-inicio" class="error" role="alert"></p>
  </div>
  <button class="enlace" type="button" data-abrir="reglas" data-t="reglas"></button>
</section>

<!-- Sala de espera -->
<section id="espera" class="pantalla" hidden>
  <div class="panel">
    <h2 data-t="sala"></h2>
    <p class="codigo-sala"><span data-t="codigoSala"></span> <strong id="codigo-sala"></strong></p>
    <button id="copiar" class="boton pequeno" type="button" data-t="copiar"></button>
    <ol id="asientos" class="asientos"></ol>
    <div id="controles-anfitrion">
      <button id="anadir-maquina" class="boton pequeno" type="button" data-t="anadirMaquina"></button>
      <div class="opciones">
        <label><span data-t="rondas"></span>
          <select id="rondas">
            <option value="3">3</option><option value="5">5</option><option value="10">10</option>
            <option value="0" data-t="sinLimite"></option>
          </select>
        </label>
        <label class="casilla"><input type="checkbox" id="revolucion"> <span data-t="variante"></span></label>
      </div>
      <button id="empezar" class="boton principal" type="button" data-t="empezar"></button>
    </div>
    <p id="aviso-espera" class="aviso"></p>
  </div>
  <button class="enlace" type="button" data-abrir="reglas" data-t="reglas"></button>
</section>

<!-- Mesa de juego -->
<section id="mesa" class="pantalla" hidden>
  <div class="barra">
    <span id="ronda"></span>
    <span id="revolucion-activa" class="sello" hidden data-t="revolucionActiva"></span>
    <span class="hueco"></span>
    <button class="boton pequeno" type="button" data-abrir="puntos" data-t="puntos"></button>
    <button class="boton pequeno" type="button" data-abrir="reglas" data-t="reglas"></button>
  </div>
  <div id="rivales" class="rivales"></div>
  <div class="claro">
    <div id="monton" class="monton" aria-live="polite"></div>
    <p id="mensaje" class="mensaje"></p>
  </div>
  <div class="mio">
    <div id="yo" class="yo"></div>
    <div id="mano" class="mano" role="group"></div>
    <div class="acciones">
      <button id="jugar" class="boton principal" type="button" data-t="jugar"></button>
      <button id="pasar" class="boton" type="button" data-t="pasar"></button>
    </div>
  </div>
  <details class="registro">
    <summary data-t="registro"></summary>
    <ol id="registro"></ol>
  </details>
</section>

<!-- Ventanas -->
<dialog id="reglas" class="ventana">
  <div id="texto-reglas" class="reglas"></div>
  <form method="dialog"><button class="boton" data-t="cerrar"></button></form>
</dialog>
<dialog id="puntos" class="ventana">
  <h2 data-t="puntos"></h2>
  <table id="tabla-puntos" class="tabla"></table>
  <form method="dialog"><button class="boton" data-t="cerrar"></button></form>
</dialog>
<dialog id="fin" class="ventana">
  <h2 id="fin-titulo"></h2>
  <table id="tabla-fin" class="tabla"></table>
  <p id="fin-nota" class="aviso"></p>
  <div class="acciones">
    <button id="fin-boton" class="boton principal" type="button"></button>
    <form method="dialog"><button class="boton" data-t="verMesa"></button></form>
  </div>
</dialog>
<div id="nota" class="nota" role="status" hidden></div>

<script src="juego.js"></script>
</body>
</html>

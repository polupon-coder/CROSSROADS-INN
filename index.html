<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CROSSROADS INN</title>
<meta name="description" content="Elige un juego y pulsa para jugar con tus amigos o contra la máquina. / Pick a game and click to play with friends or against the computer.">
<meta property="og:title" content="CROSSROADS INN">
<meta property="og:description" content="IMPERIO, REGIUM, HÉROES, MANA — elige un juego y pulsa para jugar / pick a game and play.">
<meta property="og:image" content="https://crossroads-inn-upa3.onrender.com/img/cartel-en.webp">
<meta property="og:url" content="https://crossroads-inn-upa3.onrender.com/">
<style>
@font-face { font-family: Garamond; src: url(EBGaramond.ttf) format("truetype"); font-display: swap; }
:root {
  --fondo: #140e09;
  --panel: rgba(22, 15, 9, .78);
  --borde: #5a4a37;
  --oro: #d9b26a;
  --oro-claro: #f0d59a;
  --texto: #efe6d6;
  --texto-suave: #c9b99f;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background-color: var(--fondo);
  color: var(--texto);
  font-family: Garamond, Georgia, "Times New Roman", serif;
  font-size: 18px;
  line-height: 1.45;
}
/* La madera, fija detrás de todo y algo oscurecida en el centro para que se lea el texto. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(12,8,4,.45), rgba(12,8,4,.15) 75%),
    url(img/madera.webp) center / cover no-repeat;
}

header { position: relative; text-align: center; padding: 28px 16px 8px; }
.cartel {
  display: block;
  width: min(560px, 86vw);
  height: auto;
  margin: 0 auto;
  filter: drop-shadow(0 14px 22px rgba(0,0,0,.7));
  transform-origin: 50% 0;
  animation: balanceo 6s ease-in-out infinite;
}
@keyframes balanceo { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
@media (prefers-reduced-motion: reduce) { .cartel { animation: none; } }
h1 { margin: 0; }
.lema { margin: 10px 0 0; color: var(--texto); font-size: 21px; font-style: italic; text-shadow: 0 2px 6px #000; }

/* Los juegos llegan por los lados hasta el borde exterior de la primera banda de
   hierro del fondo y tapan sus pernos. La madera mide 941 × 1672 y se escala como
   «cover», así que se calcula con la misma escala: --s píxeles por píxel de imagen.
   La banda empieza a 120 px del borde izquierdo de la imagen y a 117 del derecho. */
main {
  --s: max(100vw / 941, 100vh / 1672);
  --margen: calc((100vw - 941 * var(--s)) / 2);
  padding: 20px max(12px, calc(var(--margen) + 117 * var(--s))) 40px max(12px, calc(var(--margen) + 120 * var(--s)));
  display: grid;
  grid-template-columns: 1fr;
  gap: 34px 30px;
}
@media (min-width: 800px) { main { grid-template-columns: 1fr 1fr; } }
.juego {
  display: flex;
  flex-direction: column;
  color: inherit;
  text-decoration: none;
  transition: transform .2s ease;
}
.juego:hover, .juego:focus-within { transform: translateY(-5px); }
.portada-enlace { display: block; }
.portada { position: relative; aspect-ratio: 800 / 563; }
.portada img {
  width: 100%; height: 100%; display: block;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,.65));
  transition: filter .2s ease;
}
.juego:hover .portada img, .juego:focus-within .portada img {
  filter: drop-shadow(0 10px 18px rgba(0,0,0,.65)) drop-shadow(0 0 14px rgba(240,190,100,.55));
}
.datos {
  flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center;
  margin: 4px 0 0;
  padding: 14px 20px 18px;
  background: var(--panel);
  border: 1px solid rgba(217,178,106,.25);
  border-radius: 8px;
  backdrop-filter: blur(3px);
}
.datos h2 { margin: 0; font-size: 28px; letter-spacing: .06em; font-weight: 600; color: var(--oro-claro); }
.datos p { margin: 4px 0 14px; color: var(--texto-suave); flex: 1; }
.botones { display: flex; justify-content: center; gap: 12px; width: 100%; }
.jugar, .info {
  display: flex; align-items: center; justify-content: center;
  width: min(210px, calc(50% - 6px));
  border: 0; cursor: pointer; font-family: inherit; text-decoration: none;
  aspect-ratio: 600 / 143;
  padding-bottom: 2px;
  background: url(img/boton.webp) center / 100% 100% no-repeat;
  color: var(--oro-claro);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: .08em;
  text-shadow: 0 2px 2px #000, 0 0 8px rgba(0,0,0,.8);
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.6));
  transition: filter .2s ease, color .2s ease;
}
.jugar:hover, .jugar:focus-visible, .info:hover, .info:focus-visible {
  outline: none;
  color: #fff3d0;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.6)) drop-shadow(0 0 8px rgba(240,190,100,.6)) brightness(1.12);
}
.pronto { opacity: .6; cursor: default; }
.pronto:hover { transform: none; }
@media (max-width: 420px) { .jugar, .info { font-size: 17px; letter-spacing: .04em; } }
.pronto .jugar { filter: grayscale(.7) brightness(.8); color: var(--texto-suave); }

/* Ventana «Cómo se juega» */
.ventana {
  width: min(640px, calc(100vw - 24px));
  max-height: calc(100dvh - 24px);
  padding: 0;
  border: 1px solid rgba(217,178,106,.55);
  border-radius: 10px;
  background: #1c130c;
  color: var(--texto);
  box-shadow: 0 20px 60px rgba(0,0,0,.8);
}
.ventana::backdrop { background: rgba(8,5,2,.75); backdrop-filter: blur(2px); }
.ventana img { display: block; width: min(100%, 420px); height: auto; margin: 14px auto 0; }
.ventana .cuerpo { padding: 6px 26px 24px; text-align: center; }
.ventana h2 { margin: 0; font-size: 30px; letter-spacing: .06em; font-weight: 600; color: var(--oro-claro); }
.ventana .ficha { margin: 2px 0 10px; color: var(--oro); font-size: 16px; letter-spacing: .05em; }
.ventana .intro { margin: 0 0 12px; font-style: italic; }
.ventana ul { margin: 0 0 20px; padding: 0; list-style: none; text-align: left; }
.ventana li { position: relative; margin: 0 0 8px; padding-left: 22px; color: var(--texto-suave); }
.ventana li::before { content: "◆"; position: absolute; left: 0; top: .1em; font-size: 12px; color: var(--oro); }
.ventana b { color: var(--texto); font-weight: 600; }
.cerrar {
  position: absolute; top: 8px; right: 10px;
  width: 36px; height: 36px; border: 0; border-radius: 50%;
  background: rgba(20,14,9,.85); color: var(--oro-claro);
  font-size: 22px; line-height: 1; cursor: pointer;
}
.cerrar:hover, .cerrar:focus-visible { background: var(--oro); color: #24190c; outline: none; }

.idiomas { position: absolute; top: 14px; right: 16px; z-index: 1; display: flex; border: 1px solid var(--borde); border-radius: 6px; overflow: hidden; background: rgba(20,14,9,.7); }
.idiomas button { font: inherit; font-size: 15px; letter-spacing: .05em; padding: 4px 12px; border: 0; background: transparent; color: var(--texto-suave); cursor: pointer; }
.idiomas button[aria-pressed="true"] { background: var(--oro); color: #24190c; font-weight: 700; }
@media (max-width: 600px) { header { padding-top: 52px; } }

footer { text-align: center; padding: 0 16px 40px; color: var(--texto-suave); font-size: 16px; text-shadow: 0 1px 4px #000; }
footer p { max-width: 640px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <div class="idiomas" role="group" aria-label="Idioma / Language">
    <button type="button" data-idioma="es">ES</button>
    <button type="button" data-idioma="en">EN</button>
  </div>
  <h1><img class="cartel" id="cartel" src="img/cartel-es.webp" alt="Posada del Cruce" width="900" height="587"></h1>
  <p class="lema" data-t="lema"></p>
</header>

<main id="juegos"></main>

<dialog class="ventana" id="ventana"></dialog>

<footer>
  <p data-t="pie"></p>
</footer>

<script>
// ─────────────────────────────────────────────────────────────────────────
// TUS JUEGOS. Para añadir uno nuevo, copia un bloque { … } y cámbialo.
// «url» es la dirección donde está publicado el juego (la que da Render).

// pueden ir así, si el juego tiene una dirección distinta para cada idioma.
// «explicacion» es lo que sale al pulsar «Cómo se juega» (ficha, intro y puntos).

        ],
      },
      en: {
        ficha: "4 players · Strategy",
        intro: "Each player rules a Capital and fights to dominate the World.",
        puntos: [
          "<b>Phase I — Creation of the World:</b> take turns placing plains, forest, mountain and water tiles to build the map and gather resources.",
          "<b>Phase II — The Empire:</b> spend wood, stone, water and food to build, recruit infantry, archers, spearmen, cavalry and artillery, and raise Walls.",
          "Battles are decided with dice, and Faith lets you reroll.",
          "<b>To win</b>, own all 8 buildings and conquer 2 rival Capitals.",
          "Play online with friends; empty Capitals are taken by the computer (easy, medium or hard).",
        ],
      },
    },
  },
  {
    nombre: "REGIUM",
    url: "https://regium-bcii.onrender.com",
    imagen: "img/regium.webp",
    descripcion: {
      es: "Cinco reinos y diez guerras para reinar sobre todos.",
      en: "Five kingdoms and ten wars to rule them all.",
    },
    explicacion: {
      es: {
        ficha: "2–5 jugadores · Cartas",
        intro: "Cada jugador es el regente de un reino y quiere levantar 7 ciudades antes que nadie.",
        puntos: [
          "La partida tiene <b>10 guerras</b>: en la 1.ª se reparte 1 tropa a cada jugador, en la 2.ª 2… y en la 10.ª, 10.",
          "Al empezar cada guerra <b>apuestas</b> cuántas batallas vas a ganar. Las tropas del reino del Emperador de turno son el triunfo.",
          "Si aciertas la apuesta ganas un territorio, y con tus victorias levantas ciudades, arrasas las de tus rivales o les conquistas territorios.",
          "<b>Gana</b> el primero que levanta su 7.ª ciudad.",
          "Online con amigos o en el mismo dispositivo, también contra la máquina (fácil o difícil).",
        ],
      },
      en: {
        ficha: "2–5 players · Cards",

        ],

    },

        ],
      },
    },

];

const TEXTOS = {
  es: {
    titulo: "POSADA DEL CRUCE",
    cartel: "img/cartel-es.webp",
    lema: "Elige tu juego y pulsa para jugar",
    jugar: "Jugar",
    info: "Cómo se juega",
    cerrar: "Cerrar",
    pronto: "Próximamente",
    pie: "Todos se juegan en el navegador, con amigos por internet o contra la máquina. Si un juego tarda en abrir, espera un momento: el servidor se está despertando (hasta un minuto).",
  },
  en: {
    titulo: "CROSSROADS INN",
    cartel: "img/cartel-en.webp",
    lema: "Pick your game and click to play",
    jugar: "Play",
    info: "How to play",
    cerrar: "Close",
    pronto: "Coming soon",
    pie: "All games run in the browser, online with friends or against the computer. If a game is slow to open, give it a moment: the server is waking up (up to a minute).",
  },
};

function idiomaInicial() {
  try {
    const guardado = localStorage.getItem("idioma");
    if (guardado in TEXTOS) return guardado;
  } catch {}
  return (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
}

function pintar(idioma) {
  const t = TEXTOS[idioma];
  document.documentElement.lang = idioma;
  document.title = t.titulo;
  const cartel = document.getElementById("cartel");
  cartel.src = t.cartel;
  cartel.alt = t.titulo;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t[el.dataset.t];
  for (const b of document.querySelectorAll("[data-idioma]")) b.setAttribute("aria-pressed", b.dataset.idioma === idioma);

  const lista = document.getElementById("juegos");
  lista.replaceChildren();
  for (const j of JUEGOS) {
    const url = j.url[idioma] ?? j.url;
    const nombre = j.nombre[idioma] ?? j.nombre;
    const tarjeta = document.createElement("article");
    tarjeta.className = "juego" + (url ? "" : " pronto");
    const portada = `<div class="portada"><img src="${j.imagen}" alt="${nombre}" width="800" height="563" loading="lazy"></div>`;
    tarjeta.innerHTML = `
      ${url ? `<a class="portada-enlace" href="${url}">${portada}</a>` : portada}
      <div class="datos">
        <h2>${nombre}</h2>
        <p>${j.descripcion[idioma]}</p>
        <div class="botones">
          ${url ? `<a class="jugar" href="${url}">${t.jugar}</a>` : `<span class="jugar">${t.pronto}</span>`}
          ${j.explicacion ? `<button type="button" class="info">${t.info}</button>` : ""}
        </div>
      </div>`;
    tarjeta.querySelector(".info")?.addEventListener("click", () => explicar(j, idioma));
    lista.appendChild(tarjeta);
  }
}

// Abre la ventana «Cómo se juega» de un juego.
function explicar(j, idioma) {
  const t = TEXTOS[idioma];
  const e = j.explicacion[idioma];
  const url = j.url[idioma] ?? j.url;
  const v = document.getElementById("ventana");
  v.innerHTML = `
    <button type="button" class="cerrar" aria-label="${t.cerrar}">×</button>
    <img src="${j.imagen}" alt="" width="800" height="563">
    <div class="cuerpo">
      <h2>${j.nombre[idioma] ?? j.nombre}</h2>
      <p class="ficha">${e.ficha}</p>
      <p class="intro">${e.intro}</p>
      <ul>${e.puntos.map(x => `<li>${x}</li>`).join("")}</ul>
      <div class="botones">
        ${url ? `<a class="jugar" href="${url}">${t.jugar}</a>` : ""}
        <button type="button" class="info cerrar-abajo">${t.cerrar}</button>
      </div>
    </div>`;
  for (const b of v.querySelectorAll(".cerrar, .cerrar-abajo")) b.addEventListener("click", () => v.close());
  v.showModal();
  v.scrollTop = 0;
}
// Pulsar fuera de la ventana también la cierra.
document.getElementById("ventana").addEventListener("click", ev => {
  if (ev.target === ev.currentTarget) ev.currentTarget.close();
});

for (const b of document.querySelectorAll("[data-idioma]")) {
  b.addEventListener("click", () => {
    try { localStorage.setItem("idioma", b.dataset.idioma); } catch {}
    pintar(b.dataset.idioma);
  });
}
pintar(idiomaInicial());
</script>
</body>
</html>

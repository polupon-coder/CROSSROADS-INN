# Configuración para Render (https://render.com): New → Blueprint → este repositorio.
# También vale New → Static Site con «Publish Directory» = . y sin comando de compilación.
services:
  - type: web
    name: crossroads-inn
    runtime: static
    buildCommand: ""
    staticPublishPath: .

  # BOSQUE ENCANTADO: el juego (con servidor) vive en la carpeta bosque-encantado.
  - type: web
    name: bosque-encantado
    runtime: node
    plan: free
    rootDir: bosque-encantado
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
